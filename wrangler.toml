name = "crypto-monitor"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 严格免费额度注意：
# - Workers Free：10 万请求/天，单次调用 CPU 仅 10ms（含 Cron）。
#   本采集是 I/O 密集（等网络不算 CPU），轻量观察池可塞进 10ms；若被掐，升级 $5/月 Paid（Cron CPU 提到 30s）。
# - D1 Free：单库 500MB、500 万行读/天、10 万行写/天。15 分钟粒度下完全够用。

# ---------- 存储后端：仅使用 D1 ----------
# 先在 Cloudflare 创建 D1，再把返回的 id 填到下面 database_id。
[[d1_databases]]
binding = "DB"
database_name = "crypto_monitor"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# ---------- 部署时环境变量（Variables，非机密）----------
# 手动部署：wrangler deploy 会自动带上这里；也可在 Cloudflare Dashboard → Settings → Variables 里配。
[vars]
# 自定义观察池（USDT 本位，逗号分隔，大小写不限）。新增币种即看板新增一项；留空则用代码内置默认。
# 示例：WATCHLIST = "BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,DOGEUSDT"
# WATCHLIST = ""

# 定时采集：每 15 分钟一次（UTC）。免费额度下建议不要低于 5 分钟。
[triggers]
crons = ["*/15 * * * *"]
